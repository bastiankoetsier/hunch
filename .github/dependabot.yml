# Monthly dependency updates. Patch and minor bumps are grouped into one PR
# per ecosystem and merged automatically once CI passes
# (.github/workflows/dependabot-auto-merge.yml); majors get a PR each and
# wait for a human.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    # release.yml is generated by dist, and its `plan` job fails if the file
    # drifts from what dist would generate. These actions are bumped by
    # upgrading dist instead (see "Releasing" in the README).
    ignore:
      - dependency-name: actions/checkout
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
