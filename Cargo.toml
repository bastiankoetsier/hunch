[package]
name = "hunch"
version = "0.1.0"
edition = "2024"
description = "A small CLI for Jev, TypeSafe's System One model: calibrated yes/no, choice and score answers"
license = "MIT"
repository = "https://github.com/bastiankoetsier/hunch"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = "3.4.2"

# Dev builds: keep file:line info for panics and backtraces, but skip full
# debug info, which is most of target/'s size. Dependencies get none at all
# because we never step through clap or serde in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
